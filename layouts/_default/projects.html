{{ define "main" }}
<div class="py-12 px-4 mx-auto w-full md:w-3/4 lg:w-1/2">
    <h1 class="mb-8 text-3xl font-bold md:mb-12 md:text-5xl text-text-primary-light dark:text-text-primary-dark">{{
        .Title }}</h1>

    <div class="grid grid-cols-1 gap-6 mx-auto max-w-3xl md:gap-8">
        {{ $projectsData := index site.Data .Language.Lang "projects" }}
        {{ range $projectsData.projects }}
        <div
            class="overflow-hidden relative rounded-lg border transition-all duration-300 project-card bg-bg-primary-light border-border-primary-light group dark:bg-bg-secondary-dark dark:border-border-primary-dark">
            <div class="overflow-hidden relative aspect-w-16 aspect-h-9">
                <div
                    class="absolute inset-0 z-10 bg-gradient-to-br from-accent-light/20 to-accent-light/20 dark:from-accent-dark/20 dark:to-accent-dark/20">
                </div>
                <img src="{{ .image }}" alt="{{ .title }}"
                    class="object-cover w-full h-full transition-transform duration-500 group-hover:scale-110">
                <div
                    class="absolute inset-0 z-20 bg-gradient-to-t to-transparent opacity-60 from-black/90 via-black/50">
                </div>

                <!-- Content that moves up on hover -->
                <div
                    class="flex absolute inset-0 z-30 flex-col justify-end p-4 pb-3 transition-transform duration-500 transform translate-y-0 md:p-6 md:pb-4 group-hover:translate-y-[-20px]">
                    <h3 class="mb-1.5 text-xl font-bold text-white md:mb-2 md:text-2xl line-clamp-2">{{ .title }}</h3>
                    <div class="flex flex-wrap gap-1 mb-1.5 md:gap-2 md:mb-3">
                        {{ $techs := split .tech "," }}
                        {{ range $tech := $techs }}
                        <span
                            class="py-0.5 px-1.5 font-medium text-white rounded-md md:px-2 md:text-xs bg-neutral-700/30 backdrop-blur-sm text-[10px]">{{
                            $tech }}</span>
                        {{ end }}
                    </div>
                    <p class="hidden mb-3 text-sm text-white md:block line-clamp-3 md:line-clamp-4">{{ .description }}
                    </p>

                    <!-- Learn More button -->
                    <a href="{{ .link }}"
                        class="inline-block flex items-center py-1 px-2 text-xs font-medium rounded-md shadow-lg opacity-100 transition-all duration-300 transform md:py-1.5 md:px-3 md:text-sm md:opacity-0 dark:text-white group-hover:opacity-100 hover:shadow-xl bg-accent-light/90 backdrop-blur-sm text-neutral-800 w-fit dark:bg-accent-dark/90 dark:hover:bg-accent-dark hover:bg-accent-light">
                        Learn More
                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="ml-1 w-3.5 h-3.5 transition-transform duration-200 transform group-hover:translate-x-1"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </a>
                </div>
            </div>
        </div>
        {{ end }}
    </div>
</div>

<style>
    .project-card {
        height: 100%;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        /* Use Tailwind theme variables for more modular approach */
        @apply bg-bg-primary-light dark:bg-bg-secondary-dark;
        backdrop-filter: blur(10px);
    }

    .project-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        border-color: rgba(2, 132, 199, 0.5);
        /* accent-light with alpha */
    }

    html.dark .project-card:hover {
        border-color: rgba(14, 165, 233, 0.5);
        /* accent-dark with alpha */
    }

    .aspect-w-16 {
        position: relative;
        padding-bottom: 56.25%;
    }

    .aspect-w-16>img {
        position: absolute;
        height: 100%;
        width: 100%;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        object-fit: cover;
        filter: saturate(1.1) contrast(1.1);
    }

    @media (max-width: 768px) {
        .project-card:hover {
            transform: none;
        }

        .project-card .group-hover\:translate-y-\[-20px\] {
            transform: translateY(-10px);
        }
    }
</style>
{{ end }}
