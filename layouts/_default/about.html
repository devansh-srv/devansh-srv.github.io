{{ define "main" }}
<div class="py-12 px-4 mx-auto max-w-4xl">
    <h1 class="mb-6 text-5xl font-bold text-text-primary-light dark:text-text-primary-dark">{{ .Title }}</h1>

    <div class="flex flex-col gap-8">
        <div class="flex-grow">
            <div
                class="p-8 mb-8 rounded-lg border bg-bg-primary-light border-border-primary-light dark:bg-bg-secondary-dark dark:border-border-primary-dark">
                <div class="max-w-none prose prose-invert prose-xl">
                    <div>
                        {{ .Content }}
                    </div>
                </div>
            </div>

            {{ $authorData := index site.Data .Language.Lang "author" }}
            <div
                class="p-6 mb-8 rounded-lg border md:p-8 bg-bg-primary-light border-border-primary-light dark:bg-bg-secondary-dark dark:border-border-primary-dark">
                <h2
                    class="mb-4 text-2xl font-bold md:mb-6 md:text-3xl text-text-primary-light dark:text-text-primary-dark">
                    Academics</h2>
                <div class="space-y-6">
                    {{ range $authorData.academics }}
                    <div
                        class="flex flex-col gap-2 p-4 rounded-lg border transition-all duration-300 bg-bg-primary-light border-border-primary-light dark:bg-bg-secondary-dark dark:border-border-primary-dark">
                        <div class="text-sm text-text-secondary-light prose dark:text-text-secondary-dark">{{
                            .institution }}</div>
                        <div class="flex gap-2 items-center">
                            <h3
                                class="text-xl font-semibold md:text-2xl text-text-primary-light dark:text-text-primary-dark">
                                {{ .branch }}</h3>
                        </div>
                        <div
                            class="flex gap-2 text-sm items-left text-text-secondary-light prose dark:text-text-secondary-dark">
                            <span>{{ .CGPA }}/10</span>
                        </div>
                        <div
                            class="flex gap-2 text-sm items-right text-text-secondary-light prose dark:text-text-secondary-dark">
                            <span>{{ .batch }}</span>
                        </div>
                    </div>
                    {{ end }}
                </div>
            </div>
            <div
                class="flex justify-center p-6 mb-8 rounded-lg border md:p-8 bg-bg-primary-light border-border-primary-light dark:bg-bg-secondary-dark dark:border-border-primary-dark">
                <a href="./Resume.pdf" target="_blank" rel="noopener noreferrer"
                    class="py-3 px-6 text-xl font-semibold bg-black rounded-lg shadow-md transition md:text-2xl hover:bg-blue-700 focus:ring-2 focus:ring-blue-400 focus:outline-none text-text-primary-light dark:text-text-primary-dark">Resume</a>


            </div>

        </div>
    </div>
</div>

<style>
    .prose {
        color: #4b5563;
        /* text-secondary-light */
        font-size: 1.125rem;
    }

    html.dark .prose {
        color: #9ca3af;
        /* text-secondary-dark */
    }

    .prose p {
        color: #4b5563;
        /* text-secondary-light */
        margin-bottom: 1.5rem;
        /* Corresponds to mb-6 */
        line-height: 1.9;
    }

    html.dark .prose p {
        color: #9ca3af;
        /* text-secondary-dark */
    }

    .prose p+p {
        margin-top: 2rem;
    }

    .animated-link {
        position: relative;
        display: inline-flex;
        align-items: center;
    }

    .animated-link::after {
        content: '';
        position: absolute;
        width: 0;
        height: 1px;
        bottom: -1px;
        left: 0;
        background-color: #0284c7;
        /* accent-light */
        transition: width 0.3s ease-in-out;
    }

    .animated-link:hover::after {
        width: 100%;
    }

    html.dark .animated-link::after {
        background-color: #0ea5e9;
        /* accent-dark */
    }
</style>
{{ end }}
