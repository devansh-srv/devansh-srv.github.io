baseURL = "https://example.com"
languageCode = 'en-us'
title = 'Devansh Srivastava'
theme = 'hugo-noir'

# URL handling
relativeURLs = true
canonifyURLs = true

# Multilingual configuration
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

[languages]
  [languages.en]
    languageName = "English"
    title = "Devansh Srivastava"
    weight = 1
    contentDir = "content/en"
    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "About Me"
        pageRef = "/about" # Corresponds to content/en/about.md or content/en/about/_index.md
        weight = 1
      [[languages.en.menu.main]]
        name = "Experience"
        pageRef = "/experience"
        weight = 2
      [[languages.en.menu.main]]
        name = "Projects"
        pageRef = "/projects"
        weight = 3
      # [[languages.en.menu.main]]
      #   name = "Blog"
      #   pageRef = "/blogs" # Assumes a section named 'blogs'
      #   weight = 4
      [[languages.en.menu.main]]
        name = "Contact"
        pageRef = "/contact"
        weight = 4

